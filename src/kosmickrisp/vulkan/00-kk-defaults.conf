<?xml version="1.0"?>
<driconf>
    <device driver="kk">
        <application name="Marvel Future Fight" application_name_match="Future Fight">
            <option name="vs_position_always_invariant" value="true" />
        </application>
        <engine engine_name_match="idTech">
           <!--
              IdTech 6+ requires support for the depth bounds test.
              It only uses it as an optimization and renders correctly without it.
           -->
           <option name="kk_fake_depth_bounds" value="true" />
       </engine>

        <application name="DOOM (2016)" application_name_match="DOOM$">
           <!--
              DOOM 2016 has consecutive render passes with the same attachments and barriers in-between and no
               external subpass dependencies. (The logos before the main menu already do this.)
           -->
           <option name="kk_sync_render_passes" value="true" />
        </application>
    </device>
</driconf>
