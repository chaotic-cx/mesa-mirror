<?xml version="1.0"?>
<driconf>
    <device driver="kk">
        <engine engine_name_match="idTech">
           <!--
              IdTech 6+ requires support for the depth bounds test.
              It only uses it as an optimization and renders correctly without it.
           -->
           <option name="kk_fake_depth_bounds" value="true" />
       </engine>
    </device>
</driconf>
