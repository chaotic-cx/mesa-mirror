# Possible values
# pipe: enum name that the format info belongs to, prefixed with PIPE_FORMAT_.
# vtx: Vertex format that gets mapped, prefixed with FE_DATA_TYPE_.
# vtx_gate: GPU feature required to support the format for vertex fetches, prefixed with ETNA_FEATURE_.
# tex: Texture format that gets mapped, prefixed with TEXTURE_FORMAT_.
# tex_gate: GPU feature required to support the format as texture, prefixed with ETNA_FEATURE_.
# pe: PE format that get's mapped, prefixed with PE_FORMAT_.
# pe_gate: GPU feature required to support the format as render target, prefixed with ETNA_FEATURE_.
# zs: PE depth format that gets mapped, prefixed with VIVS_PE_DEPTH_CONFIG_DEPTH_FORMAT_.
# zs_gate: GPU feature required to support the format as depth/stencil buffer, prefixed with ETNA_FEATURE_.
# rb_swap: true if the format needs red and blue channel swapped.
# emulated: If a given format is emulated, specifies the pipe format used as replacement, prefixed with PIPE_FORMAT_.
# emulation: Name of the emulation.
#
# Values other than pipe are optional and will be filled with default
# values if left out.

# 8-bit
- pipe: R8_UNORM
  vtx: UNSIGNED_BYTE
  tex: L8
  tex_gate: HALTI0                      # needs sampler swizzle
  pe: R8
  pe_gate: HALTI5                       # R8 needs HALTI5

- pipe: R8_SNORM
  vtx: BYTE
  tex: EXT_R8_SNORM
  tex_gate: HALTI1                      # snorm needs HALTI1

- pipe: R8_UINT
  vtx: BYTE_I
  vtx_gate: HALTI2                      # pure int needs HALTI2
  tex: EXT_R8I
  tex_gate: HALTI2                      # pure int needs HALTI2
  pe: R8I
  pe_gate: HALTI5                       # R8 needs HALTI5

- pipe: R8_SINT
